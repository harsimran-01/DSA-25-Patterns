
name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest

    steps:
      - name: Welcome First-Time Contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Hey @${{ github.actor }}!

            Thank you for opening your first issue in our DSA Patterns repository! ❤️

            We appreciate your contribution. Happy Coding! 🚀

          pr-message: |
            🎉 Hey @${{ github.actor }}!

            Thank you for creating your first pull request!

            We appreciate your effort in contributing to this repository. Keep contributing and happy coding! 💻
